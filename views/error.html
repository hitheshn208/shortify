<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#0f63dc">
	<title>Page Not Found | Shortify</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/error.css">
</head>
<body>
	<main class="error-page">
		<nav class="error-nav" aria-label="Main navigation">
			<a class="brand" href="/" aria-label="Shortify home">
				<span class="brand-mark"><img src="/assets/logo.png" alt=""></span>
				<span class="brand-name">Shortify</span>
			</a>
		</nav>

		<section class="error-content" aria-labelledby="error-title">
			<div class="error-code" aria-hidden="true">404</div>
			<div class="link-badge" aria-hidden="true">
				<span class="link-dot"></span>
				<span class="link-line link-line-long"></span>
				<span class="link-line link-line-short"></span>
				<span class="link-dot"></span>
			</div>
			<p class="eyebrow">Link not found</p>
			<h1 id="error-title">This link took a wrong turn.</h1>
			<p class="error-message">The page you are looking for may have moved, expired, or never existed. Let&apos;s get you back to sharing.</p>
			<div class="error-actions">
				<a class="button button-primary" href="/">Go to Shortify<span aria-hidden="true">&rarr;</span></a>
			</div>
		</section>

		<footer class="error-footer">
			<span>Short links. Clear direction.</span>
			<span class="footer-rule" aria-hidden="true"></span>
			<span>&copy; Shortify</span>
		</footer>
	</main>
</body>
</html>
